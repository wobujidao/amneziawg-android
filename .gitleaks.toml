# Конфиг gitleaks для приложения. Заведён 18-08 вместе с `.github/workflows/security.yml`
# (до этого дня секреты в коде приложения не искал никто).
#
# Реальных секретов здесь нет и быть не должно: ключ подписи живёт в ~/.mayak-secrets на kz-serv,
# токены — в окружении процесса. Всё, на что срабатывает сканер, — заведомо фальшивые ключи в
# тестовых фикстурах: WireGuard-ключ выглядит как 44 символа base64, и правило generic-api-key
# честно на него реагирует. Отличить фикстуру от настоящего ключа сканеру нечем — это делаем мы,
# списком ниже, и КАЖДАЯ строка объяснена.
[extend]
useDefault = true

[allowlist]
description = "Фальшивые ключи в тестах и артефакты сборки"
paths = [
  # Каталоги сборки. `gitleaks dir` читает и то, чего нет в git: в tunnel/build NDK распаковывает
  # ИСХОДНИКИ Go целиком, вместе с его тестовыми данными (crypto/hpke, debug/buildinfo) — оттуда
  # 541 находка из 564 в первом же прогоне. В git этих файлов нет, на чистой машине CI их не будет
  # вовсе, но локальный прогон без этой строки бесполезен: тонет.
  '''(^|/)build/''',
  '''(^|/)\.gradle/''',
  '''(^|/)\.idea/''',

  # Тестовые конфиги туннеля: апстримные фикстуры Amnezia с заведомо неверными ключами — на них и
  # проверяется, что разбор конфига отвергает мусор.
  '''^tunnel/src/test/resources/.*\.conf$''',

  # Вложенный апстрим amneziawg-tools: в README примера разбора рукопожатий напечатан ОБРАЗЕЦ
  # вывода утилиты, с ключами вида «AAAA…». Это документация чужого инструмента, а не наш секрет.
  '''^tunnel/tools/amneziawg-tools/''',
]

# 🔴 ФАЛЬШИВЫЕ КЛЮЧИ ТЕСТОВ — ПОИМЁННО, А НЕ КАТАЛОГОМ (сужено 19-08, код-ревью п. 12).
#
# До этого дня здесь стояли три строки вида `^ui/src/test/.*\.kt$` — то есть ВСЕ тестовые файлы
# Kotlin были невидимы сканеру целиком. Настоящий секрет, попавший в тест (скопированный из
# диаг-лога человека session-токен, живой ключ Turnstile, ключ пира с боевой ноды), не нашёлся бы
# вовсе. В монорепозитории тот же пробел прикрыт вторым сторожем (scripts/check-password-literals.mjs),
# здесь второго сторожа нет — значит исключение обязано быть точечным.
#
# Теперь разрешены ровно ТРИ строки, и каждая — заведомая заглушка, читаемая глазами:
#   c2VydmVyLXB1YmtleS1mYWtl…  = base64("server-pubkey-fake-44-chars-0000000")
#   cmVsYXktcHVia2V5LWZha2U…   = base64("relay-pubkey-fake-44-chars-0000000")
#   d3MtYnJpZGdlLXRva2VuLWZha2U… = base64("ws-bridge-token-fake-00000000000")
# Все три — в core/src/test (ConfRendererTest, WsDatagramClientTest, WsUdpShimTest), проверено
# прогоном gitleaks 8.21.2 с ВЫКЛЮЧЕННЫМИ исключениями: других находок в тестах нет ни одной.
#
# Поменяли заглушку в тесте — прогон покраснеет, и это ПРАВИЛЬНО: надо дописать сюда новую строку,
# а не возвращать исключение по каталогу.
regexes = [
  '''^c2VydmVyLXB1YmtleS1mYWtlLTQ0LWNoYXJzLTAwMDAwMDA=$''',
  '''^cmVsYXktcHVia2V5LWZha2UtNDQtY2hhcnMtMDAwMDAwMA=$''',
  '''^d3MtYnJpZGdlLXRva2VuLWZha2UtMDAwMDAwMDAwMDA=$''',
]
