[versions]
agp = "9.3.1"
# Ed25519-проверка подписанного delivery-документа (F-T8): BouncyCastle lightweight API.
# НЕ Tink и НЕ java.security (Ed25519 там только с API 33, у нас minSdk 24) —
# ресёрч ядра docs/research/2026-07-11-android-ed25519-verify.md.
bouncycastle = "1.81"
# Push-уведомления (SPEC-0047, ускоритель ящика): версии Firebase берём ТОЛЬКО из BoM — она держит
# согласованными messaging/common/installations, которые между собой версиями расходятся.
firebase-bom = "34.17.0"
kotlin = "2.4.10"
kotlinx-serialization = "1.6.0"
kotlinx-coroutines = "1.7.3"

[libraries]
androidx-activity-ktx = "androidx.activity:activity-ktx:1.8.2"
androidx-annotation = "androidx.annotation:annotation:1.7.1"
androidx-appcompat = "androidx.appcompat:appcompat:1.6.1"
androidx-biometric = "androidx.biometric:biometric:1.1.0"
androidx-collection = "androidx.collection:collection:1.4.0"
androidx-constraintlayout = "androidx.constraintlayout:constraintlayout:2.1.4"
androidx-coordinatorlayout = "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
androidx-core-ktx = "androidx.core:core-ktx:1.12.0"
androidx-datastore-preferences = "androidx.datastore:datastore-preferences:1.0.0"
androidx-fragment-ktx = "androidx.fragment:fragment-ktx:1.6.2"
androidx-lifecycle-runtime-ktx = "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
androidx-preference-ktx = "androidx.preference:preference-ktx:1.2.1"
androidx-security-crypto = "androidx.security:security-crypto:1.1.0-alpha06"
androidx-work-runtime-ktx = "androidx.work:work-runtime-ktx:2.9.1"
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
desugarJdkLibs = "com.android.tools:desugar_jdk_libs:2.0.4"
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
# Версии НЕТ намеренно: её задаёт BoM выше (platform(...) в ui/build.gradle.kts).
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
google-material = "com.google.android.material:material:1.14.0"
# Проверка «есть ли на телефоне сервисы Google» (GoogleApiAvailability) — телефоны без GMS есть у части
# людей, и для них push просто не заводится. Артефакт и так приезжает с firebase-messaging, но ТОЛЬКО
# в runtime-зависимостях (в его gradle-метаданных он не api) — на classpath компиляции его нет, поэтому
# объявлен явно. Версию держим ту же, что тянет BoM, иначе получим два разных play-services-base.
google-play-services-base = "com.google.android.gms:play-services-base:18.9.0"
# Установочная метка Play: единственный канал, по которому код приглашения доезжает от ссылки до
# приложения САМ (SPEC-0049). Работает только у тех, кто ставил из магазина; при установке APK с
# сайта метки нет вовсе, и код человек вводит руками — см. MayakInstallReferrer.
google-install-referrer = "com.android.installreferrer:installreferrer:2.2"
jsr305 = "com.google.code.findbugs:jsr305:3.0.2"
junit = "junit:junit:4.13.2"
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
zxing-android-embedded = "com.journeyapps:zxing-android-embedded:4.3.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
