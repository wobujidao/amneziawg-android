name: ui (unit tests)
run-name: "ui tests • ${{ github.ref_name }}"

# JVM-юнит-тесты модуля :ui — сторожа, которые читают файлы дерева исходников и проверяют то, что
# иначе замечает только человек глазами:
#   • MayakMessagesWordsTest — в текстах ящика сообщений нет слов «VPN»/«туннель»/«обход» (их видят
#     в шторке и через плечо), и у каждого повода есть перевод;
#   • NetworkSecurityConfigPinTest — пины сертификата в прод-конфиге сети;
#   • MayakNoBackupTest — перенос кэшей в noBackupFilesDir.
#
# 🔴 Заведено 12-08. До этого дня НИ ОДИН из этих сторожей в CI не гонялся вовсе: core.yml тестирует
# только :core, а build.yml собирает APK (сборка тесты не запускает). То есть сторож, написанный
# «чтобы не забыли», сам зависел от того, вспомнит ли человек запустить его руками.
#
# Эмулятор не нужен: это чистые JVM-тесты. Ключа подписи тоже — тестам сборка APK не требуется.
on:
  push:
    paths:
      - "ui/**"
      - "core/**"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "ui/**"
  workflow_dispatch: {}

permissions:
  # Токен прогона — только на чтение. По умолчанию GITHUB_TOKEN приезжает с правами на ЗАПИСЬ в
  # репозиторий, и любой чужой шаг в этом прогоне получает их вместе с ним. Аудит 19-08 (A2):
  # правило было выполнено в одном security.yml из пяти workflow.
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      # Чужие шаги прибиты по ПОЛНОМУ SHA: метку злоумышленник переставит, отпечаток — нет
      # (аудит 19-08, A2 — правило жило только в security.yml). Версию в комментарии двигает dependabot.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3

      # 🔴 Задача называется testDebugUnitTest, а НЕ testProdReleaseUnitTest, и это не мелочь.
      # С 13-08 (1e84186c, «инструменты сборки — до последних версий») AGP заводит юнит-тестовые
      # задачи только для тестового buildType (debug). Прежнее имя перестало существовать, workflow
      # падал «task not found» — и падал 34 прогона подряд четыре дня, через релизы 0.5.1…0.5.22.
      # То есть сторожа, ради которых он заведён, всё это время не гонялись вовсе, а красный
      # значок никто не открывал. Проверять при апгрейде AGP: `./gradlew :ui:tasks --all | grep UnitTest`.
      #
      # Сборочный вариант тут не важен: все эти тесты читают ФАЙЛЫ дерева исходников
      # (res/values*/strings.xml, src/prodRelease/res/xml, манифест, .gitignore), а не ресурсы
      # собранного варианта, — они объявлены входами задачи в ui/build.gradle.kts.
      - name: Unit tests :ui
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :ui:testDebugUnitTest

      # Сторож на сторожа: BUILD SUCCESSFUL бывает и когда не запустилось НИ ОДНОГО теста
      # (задачу переименовали, фильтр не совпал, вариант исчез). Считаем прогнанные тесты по отчётам
      # и падаем, если их подозрительно мало.
      - name: Тесты действительно шли, а не пропустились
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('ui/build/test-results/testDebugUnitTest/*.xml')
          total = sum(int(ET.parse(p).getroot().get('tests')) for p in files)
          print(f'классов: {len(files)}, тестов: {total}')
          if total < 40:
              sys.exit(f'ОЖИДАЛИ хотя бы 40 тестов, прогнано {total} — сторожа не запустились')
          PY

      - name: Отчёты тестов (когда упало — смотреть сюда)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ui-test-reports
          path: ui/build/reports/tests/
          if-no-files-found: ignore
