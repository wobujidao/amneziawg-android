name: core (build + test)
run-name: "core • ${{ github.ref_name }}"

# Сборка и юнит-тесты переносимого модуля :core (чистый Kotlin/JVM, без Android-эмулятора).
# БЕЗ фильтра веток: реальная работа идёт на ветках mayak/* (ru-ota, фичи), а прежний фильтр
# [mayak-core, main, master] не совпадал ни с одной → core-тесты в CI фактически не гонялись.
# Теперь любой push, трогающий core/, тестируется (path-фильтр не даёт гонять на несвязанных пушах).
on:
  push:
    paths:
      - "core/**"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
  workflow_dispatch: {}

permissions:
  # Токен прогона — только на чтение. По умолчанию GITHUB_TOKEN приезжает с правами на ЗАПИСЬ в
  # репозиторий, и любой чужой шаг в этом прогоне получает их вместе с ним. Аудит 19-08 (A2):
  # правило было выполнено в одном security.yml из пяти workflow.
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      # Чужие шаги прибиты по ПОЛНОМУ SHA: метку злоумышленник переставит, отпечаток — нет
      # (аудит 19-08, A2 — правило жило только в security.yml). Версию в комментарии двигает dependabot.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3

      - name: Build + test :core
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :core:build
