name: security (SAST + секреты + мобильные правила)
run-name: "security • ${{ github.ref_name }}"

# 🔴 ЗАЧЕМ ЭТОТ WORKFLOW ЗАВЕДЁН (18-08).
#
# До этого дня приложение не проверял НИКАКОЙ сканер безопасности. В форке жили четыре workflow —
# сборка и юнит-тесты, и всё. При этом именно приложение стоит у людей на телефонах, держит их ключи
# и токен сессии, а весь наш арсенал (gosec, Semgrep, CodeQL, Trivy, gitleaks) гонялся в ДРУГОМ
# репозитории и только по коду ядра. Разбор — `docs/research/2026-08-18-sast-dast-sca-scs-chto-u-nas-est.md`
# в монорепозитории.
#
# Что здесь есть и зачем именно это:
#   • gitleaks   — секрет, случайно попавший в код приложения, уезжает в APK К ЛЮДЯМ и вытаскивается
#                  оттуда распаковкой. В монорепозитории такой сторож стоит с июля, здесь его не было.
#   • Semgrep    — SAST по Kotlin/Java. Наборы p/kotlin и p/secrets: в монорепозитории Semgrep
#                  настроен на p/golang и до кода приложения не дотягивается ни правилами, ни местом.
#   • mobsfscan  — правила ИМЕННО МОБИЛЬНЫЕ (команда MobSF, стандарт OWASP MASVS): хранение данных,
#                  крипта, WebView, экспортированные компоненты, перехват задач, кэш клавиатуры.
#                  Ни один сканер общего назначения этого не знает.
#
# Гейт — на severity ERROR. WARNING и INFO печатаются, но сборку не роняют: список правил у mobsfscan
# длинный и половина INFO — это «приложение не делает X», где X у нас сделан другим способом
# (пиннинг живёт в network_security_config, и правило его не видит). Принятые исключения лежат
# в `.mobsf` в корне — С ПРИЧИНОЙ у каждого, молча игнорировать нельзя.
on:
  push:
    paths:
      - "ui/**"
      - "core/**"
      - "tunnel/**"
      - "gradle/libs.versions.toml"
      - ".mobsf"
      - ".github/workflows/security.yml"
  pull_request:
  # Раз в неделю независимо от коммитов: базы уязвимостей и правила сканеров обновляются САМИ, и
  # чистый прогон месячной давности не значит, что чисто сегодня.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security:
    name: "Сканеры безопасности приложения"
    runs-on: ubuntu-latest
    steps:
      # Чужие шаги прибиты по ПОЛНОМУ SHA, а не по подвижной метке: метку злоумышленник переставит,
      # отпечаток — нет. Тот же приём, что в монорепозитории (ревью цепочки поставки).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Секреты в СОДЕРЖИМОМ файлов (не только в именах). Скачанный бинарь сверяем с официальной
      # контрольной суммой до запуска — иначе конвейер исполняет то, что прислало чужое зеркало.
      - name: gitleaks — секреты в коде приложения
        shell: bash
        run: |
          set -euo pipefail
          GLV=8.21.2
          ASSET="gitleaks_${GLV}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GLV}"
          curl -sfL --retry 5 --retry-all-errors --retry-delay 3 -o "$ASSET" "$BASE/$ASSET"
          curl -sfL --retry 5 --retry-all-errors --retry-delay 3 -o checksums.txt "$BASE/gitleaks_${GLV}_checksums.txt"
          grep " ${ASSET}\$" checksums.txt | sha256sum -c -
          tar -xzf "$ASSET" gitleaks
          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
          echo "✅ gitleaks: секретов не найдено"

      # pipx, а не pip: на раннере он предустановлен и ставит инструмент в своё окружение, не трогая
      # системный Python (там PEP 668 и `pip install` законно отказывает).
      #
      # 🔴 ВЕРСИИ ЗАКРЕПЛЕНЫ (19-08, код-ревью п. 13). Без закрепления ставилась «последняя на момент
      # прогона»: гейт молча менял то, что блокирует, — новая версия сканера либо начинает ронять
      # сборку на том, что вчера проходило, либо перестаёт видеть то, что вчера ловила. И то и другое
      # обнаруживается в худший момент. Соседние шаги того же файла давно живут по этому правилу:
      # checkout прибит по SHA, gitleaks сверяется по контрольной сумме.
      # Двигать версии — осознанно и отдельным коммитом, сверяя, что прогон остался зелёным.
      # ⚠️ Оговорка: закреплена ВЕРСИЯ ИНСТРУМЕНТА, но не наборы правил `p/kotlin` и `p/secrets` —
      # они тянутся из реестра semgrep и меняются сами. Это осознанно: правила и должны свежеть
      # (для того же заведён недельный прогон по расписанию), а вот поведение самого сканера — нет.
      - name: Поставить сканеры
        shell: bash
        run: |
          set -euo pipefail
          pipx install "semgrep==1.173.0"
          pipx install "mobsfscan==1.0.0"
          # 🔴 КАТАЛОГ БИНАРЕЙ СПРАШИВАЕМ У САМОГО pipx, а не пишем руками. На раннерах GitHub он
          # свой (/opt/pipx_bin), и прежняя строка `echo "$HOME/.local/bin"` была неверна с самого
          # начала — она просто ничего не ломала, потому что сканеры и так лежали в PATH образа.
          # Обнаружилось в тот момент, когда мы захотели напечатать версии по полному пути: шаг упал
          # с «No such file or directory» (19-08). Полагаться на образ нельзя — версии мы закрепили
          # как раз затем, чтобы гейт не зависел от того, что там окажется завтра.
          BIN="$(pipx environment --value PIPX_BIN_DIR)"
          # Версии печатаем в лог: «какой сканер это сказал» должно читаться из прогона, а не
          # выясняться задним числом. По полному пути — PATH из GITHUB_PATH действует только со
          # СЛЕДУЮЩЕГО шага. Свои окружения у каждого инструмента (так работает pipx), поэтому
          # разные требования к semgrep внутри mobsfscan никого не ломают.
          "$BIN/semgrep" --version
          "$BIN/mobsfscan" --version
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Semgrep — SAST по Kotlin и Java (гейт на ERROR)
        shell: bash
        run: |
          set -euo pipefail
          semgrep scan --config p/kotlin --config p/secrets \
            --severity ERROR --error --metrics=off --quiet \
            ui/src core/src tunnel/src
          echo "✅ Semgrep: ERROR-находок нет"

      # mobsfscan роняет прогон только на ERROR: без --exit-warning ненулевой код возврата даёт
      # именно этот уровень, а WARNING остаётся видимым в логе и читается глазами.
      #
      # ⚠️ `-c .mobsf` ОБЯЗАТЕЛЕН. Без флага конфиг ищется не в корне репозитория, а рядом с ПЕРВЫМ
      # переданным путём (`Path(base_path[0]) / '.mobsf'`, utils.py) — то есть в ui/src, где его нет.
      # Молча: сканер просто не применяет ни исключения, ни фильтр, и прогон краснеет на разборе
      # чужого кода. Поймано 18-08 при заведении этого workflow.
      - name: mobsfscan — мобильные правила OWASP MASVS (гейт на ERROR)
        shell: bash
        run: |
          set -euo pipefail
          mobsfscan -c .mobsf --type android \
            ui/src core/src tunnel/src ui/src/main/AndroidManifest.xml
          echo "✅ mobsfscan: ERROR-находок нет"

      # Пины приложения против ЖИВОЙ цепочки ядра. Пиннинг переживает плановую ротацию листа и
      # промежуточного у Let's Encrypt, но не переживёт смену иерархии (LE уже делала это: E-серия
      # под X1/X2 → YE1 под Root YE). Расхождение ломается ТИХО — приложение уходит на IP-фолбэк и
      # продолжает работать, то есть узнаём мы последними, из жалоб. Сеть недоступна — шаг
      # пропускается, а не красит сборку.
      - name: Пины приложения совпадают с живой цепочкой ядра
        shell: bash
        run: bash scripts/check-pin-set.sh
